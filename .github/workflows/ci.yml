# Corre lo mismo que `./bna test` en una máquina local: todas las suites en
# contenedores, el producto levantado con `./bna up` y el flujo de extremo a extremo.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pruebas:
    name: Suites y flujo de extremo a extremo
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Ningún archivo de claves versionado
        run: |
          if git ls-files | grep -E '(^|/)\.env($|\.local$)|(^|/)secretos[^/]*\.env$'; then
            echo "::error::Hay archivos de claves versionados (ver la lista de arriba)."
            exit 1
          fi

      - name: Todas las suites y el flujo
        run: ./bna test

      # ./bna test muestra el estado y los registros si algo falla, y elimina lo que levantó.
      - name: No quedan contenedores ni volúmenes del producto
        if: always()
        run: |
          sobra="$(docker ps -aq --filter label=com.docker.compose.project=bna; docker volume ls -q --filter label=com.docker.compose.project=bna)"
          if [ -n "$sobra" ]; then
            echo "::error::./bna test dejó contenedores o volúmenes:"
            echo "$sobra"
            docker compose down -v || true
            exit 1
          fi
