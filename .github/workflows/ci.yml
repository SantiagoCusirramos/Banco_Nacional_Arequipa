# Corre lo mismo que `./bna test` en una máquina local: todas las suites en
# contenedores, el producto levantado con `./bna up` y el flujo de extremo a extremo.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pruebas:
    name: Suites y flujo de extremo a extremo
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Ningún archivo de claves versionado
        run: |
          if git ls-files | grep -E '(^|/)\.env($|\.local$)|(^|/)secretos[^/]*\.env$'; then
            echo "::error::Hay archivos de claves versionados (ver la lista de arriba)."
            exit 1
          fi

      - name: Todas las suites y el flujo
        run: ./bna test

      - name: Estado y registros de los servicios
        if: failure()
        run: |
          docker compose ps -a || true
          docker compose logs --tail=80 || true

      - name: Detener el producto
        if: always()
        run: docker compose down -v || true

  k8s:
    name: Despliegue en Kubernetes (kind)
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Los manifiestos se generan y ningún Secret está versionado
        run: |
          kubectl kustomize k8s/overlays/local > /dev/null
          if grep -rlE '^kind:[[:space:]]*Secret' k8s; then
            echo "::error::Hay un Secret versionado en k8s/ (ver la lista de arriba). Lo crea scripts/k8s.sh desde .env."
            exit 1
          fi

      # El runner trae MySQL instalado, con un perfil de AppArmor para /usr/sbin/mysqld.
      # kind corre los pods sin perfil propio, así que ese perfil se aplica al mysqld de
      # los pods y le impide leer /etc/my.cnf: las bases no arrancan.
      # https://kind.sigs.k8s.io/docs/user/known-issues/#apparmor
      - name: Quitar del runner el perfil de AppArmor de mysqld
        run: |
          if [ -e /etc/apparmor.d/usr.sbin.mysqld ]; then
            sudo ln -sf /etc/apparmor.d/usr.sbin.mysqld /etc/apparmor.d/disable/
            sudo apparmor_parser -R /etc/apparmor.d/usr.sbin.mysqld
          fi

      - name: Desplegar en un clúster de kind
        run: ./bna k8s-up

      - name: Flujo de extremo a extremo dentro del clúster
        run: ./bna k8s-smoke

      - name: Estado del clúster
        if: failure()
        run: scripts/k8s.sh diagnostico || true

      - name: Eliminar el clúster
        if: always()
        run: ./bna k8s-down || true
