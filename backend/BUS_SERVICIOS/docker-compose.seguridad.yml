services:
  seguridad:
    build:
      context: ./seguridad
      dockerfile: Dockerfile
    container_name: bna-seguridad
    ports:
      - "127.0.0.1:8013:8000"
    env_file:
      - ./seguridad/.env
    volumes:
      - ./seguridad/runtime:/app/runtime
    networks:
      - bna-clientes_default
    restart: unless-stopped

networks:
  bna-clientes_default:
    external: true
    name: bna-clientes_default
