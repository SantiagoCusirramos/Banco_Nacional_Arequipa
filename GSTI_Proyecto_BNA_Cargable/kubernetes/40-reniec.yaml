# RENIEC simulado: interfaz administrativa publicada por NodePort (puerto autorizado). SQLite en hostPath.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: reniec
  namespace: "2022251091"
  labels: {app: reniec, app.kubernetes.io/part-of: bna-clientes}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector: {matchLabels: {app: reniec}}
  template:
    metadata: {labels: {app: reniec}}
    spec:
      initContainers:
        # La carpeta hostPath se crea como root; este paso la deja escribible para el usuario 10001 de la aplicación.
        # Si el clúster NO permite contenedores como root, cree usted la carpeta con: chown 10001:10001 /mnt/data/2022251091/bna-clientes/reniec
        # y elimine este bloque.
        - name: permisos-datos
          image: busybox:1.36
          command: ["sh", "-c", "chown -R 10001:10001 /data"]
          securityContext: {runAsUser: 0}
          resources: {requests: {cpu: 10m, memory: 16Mi}, limits: {cpu: 100m, memory: 32Mi}}
          volumeMounts: [{name: datos, mountPath: /data}]
      containers:
        - name: reniec
          image: edmaster1214/bna-reniec:latest
          imagePullPolicy: Always
          ports: [{containerPort: 8000}]
          envFrom: [{configMapRef: {name: bna-config}}]
          env:
            - {name: RENIEC_DB_PATH, value: /data/reniec.db}
            - {name: RENIEC_SERVICE_TOKEN, valueFrom: {secretKeyRef: {name: bna-secretos, key: RENIEC_SERVICE_TOKEN}}}
            - {name: RENIEC_ADMIN_PASSWORD, valueFrom: {secretKeyRef: {name: bna-secretos, key: RENIEC_ADMIN_PASSWORD}}}
          resources:
            requests: {cpu: 200m, memory: 512Mi}
            limits: {cpu: "1", memory: 1536Mi}   # TensorFlow + ArcFace necesitan ~1 GB al procesar un rostro
          readinessProbe: {httpGet: {path: /salud, port: 8000}, initialDelaySeconds: 20, periodSeconds: 10, failureThreshold: 12}
          livenessProbe: {httpGet: {path: /salud, port: 8000}, initialDelaySeconds: 120, periodSeconds: 30, failureThreshold: 4}
          securityContext: {runAsNonRoot: true, runAsUser: 10001, allowPrivilegeEscalation: false, capabilities: {drop: ["ALL"]}}
          volumeMounts: [{name: datos, mountPath: /data}]
      volumes:
        - name: datos
          hostPath: {path: "/mnt/data/2022251091/bna-clientes/reniec", type: DirectoryOrCreate}
---
apiVersion: v1
kind: Service
metadata:
  name: reniec
  namespace: "2022251091"
  labels: {app: reniec}
spec:
  type: NodePort
  selector: {app: reniec}
  ports: [{port: 8000, targetPort: 8000, nodePort: 31092}]
