# Producto integrado del BNA en una máquina local.
#
#   ./bna up      crea .env con claves aleatorias, construye y levanta todo
#   ./bna help    las demás órdenes
#
# Todos los puertos se publican solo en 127.0.0.1 y ninguna clave está en este
# archivo: salen de .env, que `./bna up` genera a partir de .env.example.
name: bna

x-construir-backend: &construir-backend
  context: ./backend
  dockerfile: ../docker/python/Dockerfile

# Cada imagen la construye un solo servicio; los demás que la usan la toman ya
# construida (pull_policy: never). Así dos construcciones no compiten por la misma etiqueta.
x-backend: &backend
  image: bna/backend:local
  pull_policy: never

x-coredb: &coredb
  image: bna/coredb:local
  pull_policy: never
  environment: &coredb-entorno
    CORE_DB_HOST: db
    CORE_DB_PORT: "3306"
    CORE_DB_APP_USER: bna_app_user
    CORE_DB_APP_PASSWORD: ${CORE_DB_APP_PASSWORD:?Falta en .env. Ejecute ./bna up}
    CORE_DB_JWT_CLAVE: ${CORE_DB_JWT_CLAVE:?Falta en .env. Ejecute ./bna up}

x-sol: &sol
  image: bna/sol:local
  pull_policy: never
  environment: &sol-entorno
    SOL_DB_HOST: db-aux
    SOL_DB_PORT: "3306"
    SOL_DB_USER: sol_user
    SOL_DB_PASSWORD: ${SOL_DB_PASSWORD:?Falta en .env. Ejecute ./bna up}
    SOL_DB_NAME: bna_sol_mvp
    SOL_INTEGRATION_MODE: SIMULADO

x-captacion: &captacion
  image: bna/backend:local
  pull_policy: never
  environment: &captacion-entorno
    # COREDB, a través del Bus (fase 2), con la credencial de CAPTACION.
    CORE_BASE_URL: http://bus:8018/bus/coredb
    BUS_TOKEN: ${BUS_TOKEN_CAPTACION:?Falta en .env. Ejecute ./bna up}
    CAP_CORE_USUARIO: svc-captacion
    CAP_CORE_SECRETO: ${CAPTACION_COREDB_SECRETO:?Falta en .env. Ejecute ./bna up}

x-sonda: &sonda
  interval: 5s
  timeout: 5s
  retries: 60
  start_period: 5s

services:
  # ── Base integrada del CORE (bna-core-db) ───────────────────────────────
  # Solo COREDB se conecta a ella. Incluye los datos de desarrollo.
  db:
    image: bna/core-db:local
    build:
      context: ./database
      dockerfile: ../docker/core-db/Dockerfile
    # No definir MYSQL_DATABASE ni MYSQL_USER: crearían un usuario con todos los
    # privilegios, fuera de los roles de la base.
    environment:
      MYSQL_ROOT_PASSWORD: ${CORE_DB_ROOT_PASSWORD:?Falta en .env. Ejecute ./bna up}
      CORE_DB_APP_PASSWORD: ${CORE_DB_APP_PASSWORD:?Falta en .env. Ejecute ./bna up}
      CORE_DB_ADMIN_PASSWORD: ${CORE_DB_ADMIN_PASSWORD:?Falta en .env. Ejecute ./bna up}
      CORE_DB_SEGURIDAD_PASSWORD: ${CORE_DB_SEGURIDAD_PASSWORD:?Falta en .env. Ejecute ./bna up}
    volumes:
      - core-db-datos:/var/lib/mysql
    networks: [core]
    ports:
      - "127.0.0.1:${BNA_PUERTO_DB:-3307}:3306"
    healthcheck:
      <<: *sonda
      # Por TCP: el servidor de inicialización no escucha por TCP, así que solo
      # pasa cuando la carga terminó.
      test:
        - CMD-SHELL
        - MYSQL_PWD="$$MYSQL_ROOT_PASSWORD" mysql -uroot -h127.0.0.1 --protocol=TCP -e 'CALL core.verificar_configuracion()'

  # ── COREDB: la API del CORE sobre la base integrada ─────────────────────
  # Solo en la red `core`, con la base y el Bus: los módulos llegan a COREDB a través del
  # Bus (fase 2), nunca directo. scripts/comprobar_rutas_coredb.py lo comprueba.
  coredb:
    <<: *coredb
    build:
      <<: *construir-backend
      args:
        REQUISITOS: requirements-coredb.txt
    command: uvicorn COREDB.main:app --host 0.0.0.0 --port 8012
    networks: [core]
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:${BNA_PUERTO_COREDB:-8012}:8012"
    healthcheck:
      <<: *sonda
      test:
        - CMD
        - python
        - -c
        - import urllib.request as u; u.urlopen("http://127.0.0.1:8012/coredb/salud", timeout=3)

  # Crea el primer administrador si no hay ninguno y los usuarios de servicio de
  # Evaluación (svc-evaluacion) y Desembolso (svc-desembolso) con los secretos de .env, y
  # termina. Repetirlo no cambia nada.
  coredb-init:
    <<: *coredb
    command:
      - sh
      - -c
      - >-
        python -m COREDB.scripts.crear_administrador --username "$$BNA_ADMIN_USUARIO"
        --nombre "Administrador inicial" --si-falta
        && CORE_DB_SERVICIO_SECRETO="$$EVALUACION_COREDB_SECRETO"
        python -m COREDB.scripts.crear_servicio --modulo EVALUACION --username svc-evaluacion --nombre Evaluación
        && CORE_DB_SERVICIO_SECRETO="$$DESEMBOLSO_COREDB_SECRETO"
        python -m COREDB.scripts.crear_servicio --modulo DESEMBOLSO --username svc-desembolso --nombre Desembolso
        && CORE_DB_SERVICIO_SECRETO="$$CAPTACION_COREDB_SECRETO"
        python -m COREDB.scripts.crear_servicio --modulo CLIENTES --username svc-captacion --nombre "Captación de clientes"
        && CORE_DB_SERVICIO_SECRETO="$$COBRANZA_COREDB_SECRETO"
        python -m COREDB.scripts.crear_servicio --modulo COBRANZA --username svc-cobranza --nombre Cobranza
        && CORE_DB_SERVICIO_SECRETO="$$BILLETERA_COREDB_SECRETO"
        python -m COREDB.scripts.crear_servicio --modulo BILLETERA --username svc-billetera --nombre "Billetera Digital"
    environment:
      <<: *coredb-entorno
      BNA_ADMIN_USUARIO: ${BNA_ADMIN_USUARIO:-admin}
      CORE_DB_ADMIN_INICIAL_PASSWORD: ${BNA_ADMIN_PASSWORD:?Falta en .env. Ejecute ./bna up}
      EVALUACION_COREDB_SECRETO: ${EVALUACION_COREDB_SECRETO:?Falta en .env. Ejecute ./bna up}
      DESEMBOLSO_COREDB_SECRETO: ${DESEMBOLSO_COREDB_SECRETO:?Falta en .env. Ejecute ./bna up}
      CAPTACION_COREDB_SECRETO: ${CAPTACION_COREDB_SECRETO:?Falta en .env. Ejecute ./bna up}
      COBRANZA_COREDB_SECRETO: ${COBRANZA_COREDB_SECRETO:?Falta en .env. Ejecute ./bna up}
      BILLETERA_COREDB_SECRETO: ${BILLETERA_COREDB_SECRETO:?Falta en .env. Ejecute ./bna up}
    networks: [core]
    depends_on:
      db:
        condition: service_healthy

  # ── CUENTAS: cuentas de ahorro, sobre COREDB ────────────────────────────
  cuentas:
    <<: *backend
    # Construye la imagen de los servicios que usan backend/requirements.txt.
    build:
      <<: *construir-backend
      args:
        REQUISITOS: requirements.txt
    command: uvicorn CUENTAS.main:app --host 0.0.0.0 --port 8001
    environment:
      # COREDB, a través del Bus (fase 2), con la credencial de CUENTAS.
      CORE_BASE_URL: http://bus:8018/bus/coredb
      BUS_TOKEN: ${BUS_TOKEN_CUENTAS:?Falta en .env. Ejecute ./bna up}
    depends_on:
      bus:
        condition: service_healthy
      coredb:
        condition: service_healthy
    ports:
      - "127.0.0.1:${BNA_PUERTO_CUENTAS:-8001}:8001"
    healthcheck:
      <<: *sonda
      test:
        - CMD
        - python
        - -c
        - import urllib.request as u; u.urlopen("http://127.0.0.1:8001/health", timeout=3)

  # ── TARJETAS: tarjetas de débito, sobre COREDB ──────────────────────────
  tarjetas:
    <<: *backend
    command: uvicorn TARJETAS.main:app --host 0.0.0.0 --port 8002
    environment:
      # COREDB, a través del Bus (fase 2), con la credencial de TARJETAS.
      CORE_BASE_URL: http://bus:8018/bus/coredb
      BUS_TOKEN: ${BUS_TOKEN_TARJETAS:?Falta en .env. Ejecute ./bna up}
    depends_on:
      bus:
        condition: service_healthy
      coredb:
        condition: service_healthy
    ports:
      - "127.0.0.1:${BNA_PUERTO_TARJETAS:-8002}:8002"
    healthcheck:
      <<: *sonda
      test:
        - CMD
        - python
        - -c
        - import urllib.request as u; u.urlopen("http://127.0.0.1:8002/ready", timeout=3)

  # ── CAPTACION: captación de clientes, sobre COREDB ──────────────────────
  # Verifica la identidad del solicitante, lo registra como cliente en COREDB y
  # publica la referencia que consulta SOL (CR-INT-01). No tiene base propia: el
  # expediente vive en la base integrada y se trabaja por COREDB. Su usuario de
  # servicio (svc-captacion, módulo CLIENTES) lo crea coredb-init.
  captacion:
    <<: *captacion
    command: uvicorn CAPTACION.main:app --host 0.0.0.0 --port 8017
    environment:
      <<: *captacion-entorno
      CAP_SOL_TOKEN: ${CAP_SOL_TOKEN:?Falta en .env. Ejecute ./bna up}
      CAP_OTP_CLAVE: ${CAP_OTP_CLAVE:?Falta en .env. Ejecute ./bna up}
      # Sin proveedor de SMS ni de correo: el código OTP vuelve en la respuesta.
      CAP_OTP_SIMULADO: "true"
    depends_on:
      bus:
        condition: service_healthy
      coredb-init:
        condition: service_completed_successfully
      coredb:
        condition: service_healthy
    ports:
      - "127.0.0.1:${BNA_PUERTO_CAPTACION:-8017}:8017"
    healthcheck:
      <<: *sonda
      test:
        - CMD
        - python
        - -c
        - import urllib.request as u; u.urlopen("http://127.0.0.1:8017/ready", timeout=3)

  # ── SOL: solicitud de crédito, con Captación y Evaluación simuladas ─────
  sol:
    <<: *sol
    build:
      <<: *construir-backend
      args:
        REQUISITOS: requirements-sol.txt
    command: uvicorn SOL.app:app --host 0.0.0.0 --port 8011
    depends_on:
      sol-init:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:${BNA_PUERTO_SOL:-8011}:8011"
    healthcheck:
      <<: *sonda
      test:
        - CMD
        - python
        - -c
        - import urllib.request as u; u.urlopen("http://127.0.0.1:8011/ready", timeout=3)

  # Crea la base de SOL y sus cuentas de demostración, y termina. No borra datos.
  sol-init:
    <<: *sol
    command: python -m SOL.manage init
    environment:
      <<: *sol-entorno
      SOL_INITIAL_PASSWORD: ${SOL_INITIAL_PASSWORD:?Falta en .env. Ejecute ./bna up}
    depends_on:
      db-aux:
        condition: service_healthy

  # ── EVALUACIÓN: evaluación crediticia (Línea de Créditos), sobre COREDB ──
  # Sin base propia: recibe el expediente de SOL (CR-INT-02) y lo registra en COREDB con su
  # usuario de servicio (svc-evaluacion, que crea coredb-init); el analista entra con su
  # token de COREDB, que Evaluación reenvía. Mientras SOL siga en modo SIMULADO,
  # EVALUACION_SOL_URL queda vacía y CR-INT-03 no corre. Ver backend/EVALUACION/README.md.
  evaluacion:
    <<: *backend
    command: uvicorn EVALUACION.main:app --host 0.0.0.0 --port 8015
    environment:
      # COREDB, a través del Bus (fase 2), con la credencial de EVALUACION.
      COREDB_URL: http://bus:8018/bus/coredb
      BUS_TOKEN: ${BUS_TOKEN_EVALUACION:?Falta en .env. Ejecute ./bna up}
      EVALUACION_COREDB_USUARIO: svc-evaluacion
      EVALUACION_COREDB_SECRETO: ${EVALUACION_COREDB_SECRETO:?Falta en .env. Ejecute ./bna up}
      EVALUACION_TOKEN_SOL: ${EVALUACION_TOKEN_SOL:?Falta en .env. Ejecute ./bna up}
      EVALUACION_SOL_TOKEN_RESULTADOS: ${EVALUACION_SOL_TOKEN_RESULTADOS:?Falta en .env. Ejecute ./bna up}
      EVALUACION_SOL_URL: ${EVALUACION_SOL_URL:-}
    depends_on:
      bus:
        condition: service_healthy
      coredb:
        condition: service_healthy
      coredb-init:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:${BNA_PUERTO_EVALUACION:-8015}:8015"
    healthcheck:
      <<: *sonda
      test:
        - CMD
        - python
        - -c
        - import urllib.request as u; u.urlopen("http://127.0.0.1:8015/salud", timeout=3)

  # ── DESEMBOLSO: desembolso de créditos (Línea de Créditos), sobre COREDB ─
  # Sin base propia: el operador entra con su token de COREDB, que Desembolso reenvía; la
  # confirmación abona, crea el crédito y desembolsa la solicitud en una sola operación de
  # COREDB. Las aprobaciones y las cuentas las lee con su usuario de servicio
  # (svc-desembolso, que crea coredb-init). Ver backend/DESEMBOLSO/README.md.
  desembolso:
    <<: *backend
    command: uvicorn DESEMBOLSO.main:app --host 0.0.0.0 --port 8016
    environment:
      # COREDB, a través del Bus (fase 2), con la credencial de DESEMBOLSO.
      COREDB_URL: http://bus:8018/bus/coredb
      BUS_TOKEN: ${BUS_TOKEN_DESEMBOLSO:?Falta en .env. Ejecute ./bna up}
      DESEMBOLSO_COREDB_USUARIO: svc-desembolso
      DESEMBOLSO_COREDB_SECRETO: ${DESEMBOLSO_COREDB_SECRETO:?Falta en .env. Ejecute ./bna up}
    depends_on:
      bus:
        condition: service_healthy
      coredb:
        condition: service_healthy
      coredb-init:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:${BNA_PUERTO_DESEMBOLSO:-8016}:8016"
    healthcheck:
      <<: *sonda
      test:
        - CMD
        - python
        - -c
        - import urllib.request as u; u.urlopen("http://127.0.0.1:8016/salud", timeout=3)

  # ── COBRANZA: cobro de las cuotas (Línea de Créditos), sobre COREDB ─────
  # Sin base propia ni cobro por CUENTAS: el crédito lo creó Desembolso en COREDB y Cobranza
  # solo lo lee y cobra sus cuotas (CR-INT-06 y CR-INT-07). La persona entra con su token de
  # COREDB, que Cobranza reenvía; la tarea diaria usa svc-cobranza (lo crea coredb-init).
  # Ver backend/COBRANZA/README.md.
  cobranza:
    <<: *backend
    command: uvicorn COBRANZA.main:app --host 0.0.0.0 --port 8014
    environment:
      # COREDB, a través del Bus (fase 2), con la credencial de COBRANZA.
      COREDB_URL: http://bus:8018/bus/coredb
      BUS_TOKEN: ${BUS_TOKEN_COBRANZA:?Falta en .env. Ejecute ./bna up}
      COBRANZA_COREDB_USUARIO: svc-cobranza
      COBRANZA_COREDB_SECRETO: ${COBRANZA_COREDB_SECRETO:?Falta en .env. Ejecute ./bna up}
    depends_on:
      bus:
        condition: service_healthy
      coredb:
        condition: service_healthy
      coredb-init:
        condition: service_completed_successfully
    networks: [default]
    ports:
      - "127.0.0.1:${BNA_PUERTO_COBRANZA:-8014}:8014"
    healthcheck:
      <<: *sonda
      test:
        - CMD
        - python
        - -c
        - import urllib.request as u; u.urlopen("http://127.0.0.1:8014/salud", timeout=3)

  # ── ATM: cajero automático, sobre TARJETAS y CUENTAS por Bus ──────────────
  # Sirve la pantalla del cajero y orquesta: validar PIN → autorizar (retención)
  # → dispensar → confirmar (idempotente) / extorno si falla. Sin base propia.
  # Ver backend/ATM/README.md.
  atm:
    <<: *backend
    command: uvicorn ATM.main:app --host 0.0.0.0 --port 8019
    environment:
      # TARJETAS y CUENTAS, a través del Bus (fase 2), con la credencial de ATM.
      BUS_BASE_URL: http://bus:8018
      BUS_TOKEN: ${BUS_TOKEN_ATM:?Falta en .env. Ejecute ./bna up}
      ATM_ID: DEV-ATM-01  # terminal de bna_datos_dev.sql
    depends_on:
      bus:
        condition: service_healthy
      tarjetas:
        condition: service_healthy
      cuentas:
        condition: service_healthy
    networks: [default, canales]
    ports:
      - "127.0.0.1:${BNA_PUERTO_ATM:-8019}:8019"
    healthcheck:
      <<: *sonda
      test:
        - CMD
        - python
        - -c
        - import urllib.request as u; u.urlopen("http://127.0.0.1:8019/ready", timeout=3)

  # ── BILLETERA: API de Chaski (Billetera Digital, canal BD), sobre COREDB ──
  # Sin base propia: opera por /coredb/billetera/* a través del Bus, con su usuario de
  # servicio svc-billetera y el token del cliente que COREDB emite al validar celular y PIN.
  # La app móvil la llama en el puerto de abajo. Ver billetera-chaski/README.md.
  billetera:
    image: bna/billetera:local
    build:
      context: ./billetera-chaski/backend
      dockerfile: ../../docker/billetera/Dockerfile
    environment:
      # COREDB, a través del Bus (fase 2), con la credencial de BILLETERA.
      COREDB_URL: http://bus:8018/bus/coredb
      BUS_TOKEN: ${BUS_TOKEN_BILLETERA:?Falta en .env. Ejecute ./bna up}
      CHASKI_COREDB_USUARIO: svc-billetera
      CHASKI_COREDB_SECRETO: ${BILLETERA_COREDB_SECRETO:?Falta en .env. Ejecute ./bna up}
      PORT: "3000"
    depends_on:
      bus:
        condition: service_healthy
      coredb:
        condition: service_healthy
      coredb-init:
        condition: service_completed_successfully
    networks: [default, canales]
    ports:
      - "127.0.0.1:${BNA_PUERTO_BILLETERA:-8020}:3000"
    healthcheck:
      <<: *sonda
      test:
        - CMD
        - node
        - -e
        - fetch("http://127.0.0.1:3000/api/listo").then(r => process.exit(r.ok ? 0 : 1), () => process.exit(1))

  # ── Seguridad: prototipo sobre SQLite ───────────────────────────────────
  seguridad:
    image: bna/seguridad:local
    build:
      <<: *construir-backend
      args:
        REQUISITOS: requirements-seguridad.txt
    command: uvicorn seguridad.app:app --host 0.0.0.0 --port 8013
    environment:
      SEGURIDAD_SECRET_KEY: ${SEGURIDAD_SECRET_KEY:?Falta en .env. Ejecute ./bna up}
      SEGURIDAD_DB: /datos/seguridad.sqlite3
    volumes:
      - seguridad-datos:/datos
    ports:
      - "127.0.0.1:${BNA_PUERTO_SEGURIDAD:-8013}:8013"
    healthcheck:
      <<: *sonda
      test:
        - CMD
        - python
        - -c
        - import urllib.request as u; u.urlopen(u.Request("http://127.0.0.1:8013/seguridad/estado", headers={"X-Correlation-ID":"sonda"}), timeout=3)

  # ── Bus de Servicios: los canales y los módulos llegan a otros módulos solo por él ─
  # /bus/<módulo>/<ruta> → el módulo, sin tocar cabeceras, cuerpo ni códigos. Cada
  # consumidor presenta su credencial (X-Bus-Token). El frontend está en la red
  # `canales` con el Bus y nada más: no puede llamar a un módulo directo. COREDB está
  # en la red `core` con el Bus y nada más: los módulos llegan a COREDB por el Bus (fase 2).
  bus:
    <<: *backend
    command: uvicorn BUS_SERVICIOS.main:app --host 0.0.0.0 --port 8018
    environment:
      BUS_URL_COREDB: http://coredb:8012
      BUS_URL_CUENTAS: http://cuentas:8001
      BUS_URL_TARJETAS: http://tarjetas:8002
      BUS_URL_CAPTACION: http://captacion:8017
      BUS_URL_SOL: http://sol:8011
      BUS_URL_EVALUACION: http://evaluacion:8015
      BUS_URL_DESEMBOLSO: http://desembolso:8016
      BUS_URL_COBRANZA: http://cobranza:8014
      BUS_URL_SEGURIDAD: http://seguridad:8013
      BUS_URL_ATM: http://atm:8019
      BUS_URL_BILLETERA: http://billetera:3000
      # FRONTEND: los puentes del frontend. PRUEBAS: el flujo de extremo a extremo. El resto:
      # cada módulo que llama a COREDB (fase 2).
      BUS_CONSUMIDORES: FRONTEND,PRUEBAS,CUENTAS,TARJETAS,CAPTACION,EVALUACION,DESEMBOLSO,COBRANZA,ATM,BILLETERA
      BUS_TOKEN_FRONTEND: ${BUS_TOKEN_FRONTEND:?Falta en .env. Ejecute ./bna up}
      BUS_TOKEN_PRUEBAS: ${BUS_TOKEN_PRUEBAS:?Falta en .env. Ejecute ./bna up}
      BUS_TOKEN_CUENTAS: ${BUS_TOKEN_CUENTAS:?Falta en .env. Ejecute ./bna up}
      BUS_TOKEN_TARJETAS: ${BUS_TOKEN_TARJETAS:?Falta en .env. Ejecute ./bna up}
      BUS_TOKEN_CAPTACION: ${BUS_TOKEN_CAPTACION:?Falta en .env. Ejecute ./bna up}
      BUS_TOKEN_EVALUACION: ${BUS_TOKEN_EVALUACION:?Falta en .env. Ejecute ./bna up}
      BUS_TOKEN_DESEMBOLSO: ${BUS_TOKEN_DESEMBOLSO:?Falta en .env. Ejecute ./bna up}
      BUS_TOKEN_COBRANZA: ${BUS_TOKEN_COBRANZA:?Falta en .env. Ejecute ./bna up}
      BUS_TOKEN_ATM: ${BUS_TOKEN_ATM:?Falta en .env. Ejecute ./bna up}
      BUS_TOKEN_BILLETERA: ${BUS_TOKEN_BILLETERA:?Falta en .env. Ejecute ./bna up}
    networks: [default, canales, core]
    ports:
      - "127.0.0.1:${BNA_PUERTO_BUS:-8018}:8018"
    healthcheck:
      <<: *sonda
      test:
        - CMD
        - python
        - -c
        - import urllib.request as u; u.urlopen("http://127.0.0.1:8018/salud", timeout=3)

  # ── Frontend ────────────────────────────────────────────────────────────
  frontend:
    image: bna/frontend:local
    build:
      context: ./frontend
      dockerfile: ../docker/frontend/Dockerfile
    # El navegador solo habla con el frontend, que reenvía desde su servidor por el Bus.
    environment:
      COREDB_URL: http://bus:8018/bus/coredb
      CUENTAS_GATEWAY_URL: http://bus:8018/bus/cuentas/api/v1/cuentas
      TARJETAS_GATEWAY_URL: http://bus:8018/bus/tarjetas/api/v1/tarjetas
      SOL_GATEWAY_URL: http://bus:8018/bus/sol/gateway/sol
      SOL_COOKIE_SECURE: "false"
      EVALUACION_GATEWAY_URL: http://bus:8018/bus/evaluacion/eva/v1
      DESEMBOLSO_GATEWAY_URL: http://bus:8018/bus/desembolso/api/v1
      COBRANZA_GATEWAY_URL: http://bus:8018/bus/cobranza
      CAPTACION_GATEWAY_URL: http://bus:8018/bus/captacion/api/v1/captacion
      BUS_TOKEN: ${BUS_TOKEN_FRONTEND:?Falta en .env. Ejecute ./bna up}
    networks: [canales]
    depends_on:
      bus:
        condition: service_healthy
      coredb:
        condition: service_healthy
      cuentas:
        condition: service_healthy
      tarjetas:
        condition: service_healthy
      sol:
        condition: service_healthy
      evaluacion:
        condition: service_healthy
      desembolso:
        condition: service_healthy
      cobranza:
        condition: service_healthy
      captacion:
        condition: service_healthy
      atm:
        condition: service_healthy
    ports:
      - "127.0.0.1:${BNA_PUERTO_FRONTEND:-3000}:3000"
    healthcheck:
      <<: *sonda
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3000/"]

  # ── CORE legado (opcional) ──────────────────────────────────────────────
  # API anterior sobre el esquema `bna`. Ningún servicio la llama ya: solo se
  # levanta con el perfil `legado` (COMPOSE_PROFILES=legado ./bna up). Tiene los
  # créditos, que COREDB todavía no ofrece. Todas sus rutas salvo el login exigen token.
  core-legado:
    <<: *backend
    profiles: [legado]
    command: uvicorn main:app --host 0.0.0.0 --port 8000
    environment:
      DB_HOST: db-aux
      DB_PORT: "3306"
      DB_NAME: bna
      DB_USER: bna_user
      DB_PASSWORD: ${LEGADO_DB_PASSWORD:?Falta en .env. Ejecute ./bna up}
      SECRET_KEY: ${LEGADO_SECRET_KEY:?Falta en .env. Ejecute ./bna up}
    depends_on:
      db-aux:
        condition: service_healthy
    ports:
      - "127.0.0.1:${BNA_PUERTO_CORE_LEGADO:-8000}:8000"
    healthcheck:
      <<: *sonda
      test:
        - CMD
        - python
        - -c
        - import urllib.request as u; u.urlopen("http://127.0.0.1:8000/health", timeout=3)

  # ── Base auxiliar: `bna` legada y `bna_sol_mvp` de SOL ────────────────
  # Aparte de la base integrada, que no recibe esquemas ni usuarios ajenos.
  db-aux:
    image: bna/db-aux:local
    build: ./docker/db-aux
    environment:
      MYSQL_ROOT_PASSWORD: ${AUX_DB_ROOT_PASSWORD:?Falta en .env. Ejecute ./bna up}
      LEGADO_DB_PASSWORD: ${LEGADO_DB_PASSWORD:?Falta en .env. Ejecute ./bna up}
      SOL_DB_PASSWORD: ${SOL_DB_PASSWORD:?Falta en .env. Ejecute ./bna up}
    volumes:
      - "./backend/Infraestructura - BD/Trabajo_hecho/BD/99_bna_unificado.sql:/docker-entrypoint-initdb.d/01_bna_legada.sql:ro"
      - db-aux-datos:/var/lib/mysql
    healthcheck:
      <<: *sonda
      test:
        - CMD-SHELL
        - MYSQL_PWD="$$MYSQL_ROOT_PASSWORD" mysql -uroot -h127.0.0.1 --protocol=TCP -e 'SELECT 1 FROM mysql.user WHERE user = "sol_user"' | grep -q 1

networks:
  default:
  # Solo el frontend y el Bus: el frontend no ve los módulos.
  canales:
  # Solo la base, COREDB, su arranque y el Bus: los módulos no ven COREDB.
  core:

volumes:
  core-db-datos:
  db-aux-datos:
  seguridad-datos:
