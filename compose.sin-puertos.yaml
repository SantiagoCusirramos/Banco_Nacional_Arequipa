# Modo prueba: ningún puerto en el anfitrión. Lo agrega `./bna test` (COMPOSE_FILE) para que
# varias corridas a la vez no compitan por los puertos; las suites y el flujo corren dentro de
# las redes de Compose. `./bna up` no lo usa: el producto se publica igual que siempre.
# scripts/test_aislamiento_pruebas.py comprueba que nombra a todos los servicios con `ports:`.
services:
  db:
    ports: !reset []
  coredb:
