  tarjetas:
    ports: !reset []
  captacion:
    ports: !reset []
  sol:
    ports: !reset []
  evaluacion:
    ports: !reset []
  desembolso:
    ports: !reset []
  cobranza:
    ports: !reset []
  atm:
    ports: !reset []
  billetera:
    ports: !reset []
  seguridad:
    ports: !reset []
  bus:
    ports: !reset []
  frontend:
    ports: !reset []
