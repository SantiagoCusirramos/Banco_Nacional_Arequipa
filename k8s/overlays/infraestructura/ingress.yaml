# Publicación por Traefik (el Ingress del clúster), por nombre de host con sslip.io, que
# resuelve <nombre>.172.16.10.31.sslip.io a 172.16.10.31. Solo HTTP.
#   bna.…           el frontend (portal, /homebanking/ y los puentes /api/…)
#   bna-cajero.…    la pantalla del cajero (ATM)
#   bna-billetera.… la API de la billetera (Chaski)
#   bna-bus.…       el Bus de Servicios: cada ruta /bus/… exige X-Bus-Token
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: web
spec:
  ingressClassName: traefik
  rules:
    - host: bna.172.16.10.31.sslip.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend: { service: { name: frontend, port: { name: http } } }
    - host: bna-cajero.172.16.10.31.sslip.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend: { service: { name: atm, port: { name: http } } }
    - host: bna-billetera.172.16.10.31.sslip.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend: { service: { name: billetera, port: { name: http } } }
    - host: bna-bus.172.16.10.31.sslip.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend: { service: { name: bus, port: { name: http } } }
