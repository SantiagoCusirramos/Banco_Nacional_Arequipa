# GENERADO por scripts/overlay_infraestructura.py a partir de k8s/base: no editar a mano.
# Para regenerarlo: python3 scripts/overlay_infraestructura.py generar
#
# Por cada Deployment que usa claves: el contenedor de inicio `secretos` copia del PVC
# bna-secretos solo las claves del pod (BNA_CLAVES: archivo, variable, clave del .env), y cada
# contenedor deja de leerlas del Secret y las carga de /secretos antes de su orden.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: db
spec:
  template:
    spec:
      initContainers:
      - name: secretos
        image: bna/backend:local
        command:
        - sh
        - /scripts/copiar.sh
        env:
        - name: BNA_CLAVES
          value: |
            env MYSQL_ROOT_PASSWORD CORE_DB_ROOT_PASSWORD
            env CORE_DB_APP_PASSWORD CORE_DB_APP_PASSWORD
            env CORE_DB_ADMIN_PASSWORD CORE_DB_ADMIN_PASSWORD
            env CORE_DB_SEGURIDAD_PASSWORD CORE_DB_SEGURIDAD_PASSWORD
        volumeMounts:
        - name: bna-secretos
          mountPath: /bna-secretos
          readOnly: true
        - name: secretos
          mountPath: /secretos
        - name: scripts-secretos
          mountPath: /scripts
          readOnly: true
        resources:
          requests:
            cpu: 10m
            memory: 16Mi
          limits:
            cpu: 100m
            memory: 64Mi
        securityContext:
          runAsUser: 10001
          runAsGroup: 10001
          runAsNonRoot: true
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
      containers:
      - name: mysql
        command:
        - sh
        - -c
        - set -a; . /secretos/env; set +a; exec "$0" "$@"
        - docker-entrypoint.sh
        - mysqld
        env:
        - name: MYSQL_ROOT_PASSWORD
          $patch: delete
        - name: CORE_DB_APP_PASSWORD
          $patch: delete
        - name: CORE_DB_ADMIN_PASSWORD
          $patch: delete
        - name: CORE_DB_SEGURIDAD_PASSWORD
          $patch: delete
        volumeMounts:
        - name: secretos
          mountPath: /secretos
          readOnly: true
        startupProbe:
          exec:
            command:
            - sh
            - -c
            - set -a; . /secretos/env; set +a; MYSQL_PWD="$MYSQL_ROOT_PASSWORD" mysql -uroot -h127.0.0.1 --protocol=TCP -e "CALL core.verificar_configuracion()"
        readinessProbe:
          exec:
            command:
            - sh
            - -c
            - set -a; . /secretos/env; set +a; MYSQL_PWD="$MYSQL_ROOT_PASSWORD" mysql -uroot -h127.0.0.1 --protocol=TCP -e "SELECT 1"
      volumes:
      - name: secretos
        emptyDir:
          medium: Memory
          sizeLimit: 1Mi
      - name: bna-secretos
        persistentVolumeClaim:
          claimName: secretos
          readOnly: true
      - name: scripts-secretos
        configMap:
          name: bna-scripts-secretos
          defaultMode: 365
---
