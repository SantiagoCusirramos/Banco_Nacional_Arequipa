apiVersion: apps/v1
kind: Deployment
metadata:
  name: evaluacion
spec:
  template:
    spec:
      securityContext:
        fsGroup: 10001
      initContainers:
      - name: secretos
        image: bna/backend:local
        command:
        - sh
        - /scripts/copiar.sh
        env:
        - name: BNA_CLAVES
          value: |
            esperar-coredb BUS_TOKEN BUS_TOKEN_EVALUACION
            env BUS_TOKEN BUS_TOKEN_EVALUACION
            env EVALUACION_COREDB_SECRETO EVALUACION_COREDB_SECRETO
            env EVALUACION_TOKEN_SOL EVALUACION_TOKEN_SOL
            env EVALUACION_SOL_TOKEN_RESULTADOS EVALUACION_SOL_TOKEN_RESULTADOS
        volumeMounts:
        - name: bna-secretos
          mountPath: /bna-secretos
          readOnly: true
        - name: secretos
          mountPath: /secretos
        - name: scripts-secretos
          mountPath: /scripts
          readOnly: true
        resources:
          requests:
            cpu: 10m
            memory: 16Mi
          limits:
            cpu: 100m
            memory: 64Mi
        securityContext:
          runAsUser: 10001
          runAsGroup: 10001
          runAsNonRoot: true
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
      - name: esperar-coredb
        command:
        - sh
        - -c
        - set -a; . /secretos/esperar-coredb; set +a; exec "$0" "$@"
        - python
        - -c
        - |
          import os, sys, time, urllib.request as u
          pedido = u.Request(os.environ["COREDB_URL"] + "/coredb/salud",
                             headers={"X-Bus-Token": os.environ["BUS_TOKEN"]})
          for _ in range(150):
              try:
                  u.urlopen(pedido, timeout=2)
                  sys.exit(0)
              except OSError:
                  time.sleep(2)
          sys.exit("COREDB no respondió a tiempo a través del Bus.")
        env:
        - name: BUS_TOKEN
          $patch: delete
        volumeMounts:
        - name: secretos
          mountPath: /secretos
          readOnly: true
      containers:
      - name: evaluacion
        command:
        - sh
        - -c
        - set -a; . /secretos/env; set +a; exec "$0" "$@"
        - uvicorn
        - EVALUACION.main:app
        - --host
        - 0.0.0.0
        - --port
        - '8015'
        env:
        - name: BUS_TOKEN
          $patch: delete
        - name: EVALUACION_COREDB_SECRETO
          $patch: delete
        - name: EVALUACION_TOKEN_SOL
          $patch: delete
        - name: EVALUACION_SOL_TOKEN_RESULTADOS
          $patch: delete
        volumeMounts:
        - name: secretos
          mountPath: /secretos
          readOnly: true
      volumes:
      - name: secretos
        emptyDir:
          medium: Memory
          sizeLimit: 1Mi
      - name: bna-secretos
        persistentVolumeClaim:
          claimName: secretos
          readOnly: true
      - name: scripts-secretos
        configMap:
          name: bna-scripts-secretos
          defaultMode: 365
---
