apiVersion: apps/v1
kind: Deployment
metadata:
  name: billetera
spec:
  template:
    spec:
      securityContext:
        fsGroup: 1000
      initContainers:
      - name: secretos
        image: bna/backend:local
        command:
        - sh
        - /scripts/copiar.sh
        env:
        - name: BNA_CLAVES
          value: |
            esperar-coredb BUS_TOKEN BUS_TOKEN_BILLETERA
            env BUS_TOKEN BUS_TOKEN_BILLETERA
            env CHASKI_COREDB_SECRETO BILLETERA_COREDB_SECRETO
        volumeMounts:
        - name: bna-secretos
          mountPath: /bna-secretos
          readOnly: true
        - name: secretos
          mountPath: /secretos
        - name: scripts-secretos
          mountPath: /scripts
          readOnly: true
        resources:
          requests:
            cpu: 10m
            memory: 16Mi
          limits:
            cpu: 100m
            memory: 64Mi
        securityContext:
          runAsUser: 10001
          runAsGroup: 10001
          runAsNonRoot: true
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
      - name: esperar-coredb
        command:
        - sh
        - -c
        - set -a; . /secretos/esperar-coredb; set +a; exec "$0" "$@"
        - node
        - -e
        - |
          const pedir = () => fetch(process.env.COREDB_URL + "/coredb/salud",
            { headers: { "X-Bus-Token": process.env.BUS_TOKEN }, signal: AbortSignal.timeout(2000) });
          (async () => {
            for (let i = 0; i < 150; i++) {
              try { if ((await pedir()).ok) process.exit(0); } catch {}
              await new Promise((r) => setTimeout(r, 2000));
            }
            console.error("COREDB no respondió a tiempo a través del Bus.");
            process.exit(1);
          })();
        env:
        - name: BUS_TOKEN
          $patch: delete
        volumeMounts:
        - name: secretos
          mountPath: /secretos
          readOnly: true
      containers:
      - name: billetera
        command:
        - sh
        - -c
        - set -a; . /secretos/env; set +a; exec "$0" "$@"
        - node
        - server.js
        env:
        - name: BUS_TOKEN
          $patch: delete
        - name: CHASKI_COREDB_SECRETO
          $patch: delete
        volumeMounts:
        - name: secretos
          mountPath: /secretos
          readOnly: true
      volumes:
      - name: secretos
        emptyDir:
          medium: Memory
          sizeLimit: 1Mi
      - name: bna-secretos
        persistentVolumeClaim:
          claimName: secretos
          readOnly: true
      - name: scripts-secretos
        configMap:
          name: bna-scripts-secretos
          defaultMode: 365
