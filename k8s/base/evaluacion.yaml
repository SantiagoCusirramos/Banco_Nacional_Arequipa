# EVALUACIÓN: evaluación crediticia, sobre COREDB. No tiene base propia: registra el
# expediente de SOL con su usuario de servicio (svc-evaluacion, que crea el arranque de
# COREDB) y reenvía a COREDB el token del analista.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: evaluacion
  labels: { app.kubernetes.io/name: evaluacion }
spec:
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: evaluacion }
  template:
    metadata:
      labels: { app.kubernetes.io/name: evaluacion }
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile: { type: RuntimeDefault }
      initContainers:
        # COREDB crea svc-evaluacion antes de arrancar: cuando responde, el usuario ya existe.
        - name: esperar-coredb
          image: bna/backend:local
          command:
            - python
            - -c
            - |
              import sys, time, urllib.request as u
              for _ in range(150):
                  try:
                      u.urlopen("http://coredb:8012/coredb/salud", timeout=2)
                      sys.exit(0)
                  except OSError:
                      time.sleep(2)
              sys.exit("COREDB no respondió a tiempo.")
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 500m, memory: 256Mi }
          securityContext: &contenedor-seguro
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL] }
      containers:
        - name: evaluacion
          image: bna/backend:local
          command: [uvicorn, EVALUACION.main:app, --host, 0.0.0.0, --port, "8015"]
          env:
            - name: COREDB_URL
              valueFrom: { configMapKeyRef: { name: bna-configuracion, key: COREDB_URL } }
            - name: EVALUACION_COREDB_USUARIO
              value: svc-evaluacion
            - name: EVALUACION_COREDB_SECRETO
              valueFrom: { secretKeyRef: { name: bna-secretos, key: EVALUACION_COREDB_SECRETO } }
            - name: EVALUACION_TOKEN_SOL
              valueFrom: { secretKeyRef: { name: bna-secretos, key: EVALUACION_TOKEN_SOL } }
            - name: EVALUACION_SOL_TOKEN_RESULTADOS
              valueFrom: { secretKeyRef: { name: bna-secretos, key: EVALUACION_SOL_TOKEN_RESULTADOS } }
          ports:
            - { name: http, containerPort: 8015 }
          # /salud comprueba COREDB y el login del usuario de servicio: sirve para recibir tráfico,
          # no para reiniciar el pod si COREDB cae.
          startupProbe:
            httpGet: { path: /salud, port: http }
            periodSeconds: 3
            failureThreshold: 40
          readinessProbe:
            httpGet: { path: /salud, port: http }
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            tcpSocket: { port: http }
            periodSeconds: 20
            timeoutSeconds: 3
          resources:
            requests: { cpu: 50m, memory: 96Mi }
            limits: { cpu: 500m, memory: 256Mi }
          securityContext: *contenedor-seguro
---
apiVersion: v1
kind: Service
metadata:
  name: evaluacion
spec:
  selector: { app.kubernetes.io/name: evaluacion }
  ports:
    - { name: http, port: 8015, targetPort: http }
