# Base auxiliar: la base `bna_sol_mvp` de SOL. Aparte de la base integrada, que
# no recibe esquemas ni usuarios ajenos.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: db-aux-datos
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: db-aux
  labels: { app.kubernetes.io/name: db-aux }
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels: { app.kubernetes.io/name: db-aux }
  template:
    metadata:
      labels: { app.kubernetes.io/name: db-aux }
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: mysql
          image: bna/db-aux:local
          env:
            - name: MYSQL_ROOT_PASSWORD
              valueFrom: { secretKeyRef: { name: bna-secretos, key: AUX_DB_ROOT_PASSWORD } }
            - name: LEGADO_DB_PASSWORD
              valueFrom: { secretKeyRef: { name: bna-secretos, key: LEGADO_DB_PASSWORD } }
            - name: SOL_DB_PASSWORD
              valueFrom: { secretKeyRef: { name: bna-secretos, key: SOL_DB_PASSWORD } }
          ports:
            - { name: mysql, containerPort: 3306 }
          volumeMounts:
            - { name: datos, mountPath: /var/lib/mysql }
          startupProbe:
            exec:
              command: [sh, -c, 'MYSQL_PWD="$MYSQL_ROOT_PASSWORD" mysql -uroot -h127.0.0.1 --protocol=TCP -N -e "SELECT 1 FROM mysql.user WHERE user = ''sol_user''" | grep -q 1']
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 60
          readinessProbe:
            exec:
              command: [sh, -c, 'MYSQL_PWD="$MYSQL_ROOT_PASSWORD" mysql -uroot -h127.0.0.1 --protocol=TCP -e "SELECT 1"']
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            tcpSocket: { port: mysql }
            periodSeconds: 20
            timeoutSeconds: 5
          resources:
            requests: { cpu: 100m, memory: 384Mi }
            limits: { cpu: "1", memory: 768Mi }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL] }
      volumes:
        - name: datos
          persistentVolumeClaim: { claimName: db-aux-datos }
---
apiVersion: v1
kind: Service
metadata:
  name: db-aux
spec:
  selector: { app.kubernetes.io/name: db-aux }
  ports:
    - { name: mysql, port: 3306, targetPort: mysql }
