# CAPTACION: captación de clientes, sobre COREDB. No tiene base propia: el expediente
# vive en la base integrada y se trabaja por COREDB. Su usuario de servicio
# (svc-captacion, módulo CLIENTES) lo crea el arranque de COREDB con el secreto del Secret.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: captacion
  labels: { app.kubernetes.io/name: captacion }
spec:
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: captacion }
  template:
    metadata:
      labels: { app.kubernetes.io/name: captacion }
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile: { type: RuntimeDefault }
      initContainers:
        # COREDB crea svc-captacion antes de arrancar: cuando responde, el usuario ya existe.
        - name: esperar-coredb
          image: bna/backend:local
          command:
            - python
            - -c
            - |
              import sys, time, urllib.request as u
              for _ in range(150):
                  try:
                      u.urlopen("http://coredb:8012/coredb/salud", timeout=2)
                      sys.exit(0)
                  except OSError:
                      time.sleep(2)
              sys.exit("COREDB no respondió a tiempo.")
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 500m, memory: 256Mi }
          securityContext: &contenedor-seguro
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL] }
      containers:
        - name: captacion
          image: bna/backend:local
          command: [uvicorn, CAPTACION.main:app, --host, 0.0.0.0, --port, "8017"]
          envFrom:
            - configMapRef: { name: bna-configuracion }
          env:
            - name: CAP_CORE_SECRETO
              valueFrom: { secretKeyRef: { name: bna-secretos, key: CAPTACION_COREDB_SECRETO } }
            - name: CAP_SOL_TOKEN
              valueFrom: { secretKeyRef: { name: bna-secretos, key: CAP_SOL_TOKEN } }
            - name: CAP_OTP_CLAVE
              valueFrom: { secretKeyRef: { name: bna-secretos, key: CAP_OTP_CLAVE } }
          ports:
            - { name: http, containerPort: 8017 }
          startupProbe:
            httpGet: { path: /ready, port: http }
            periodSeconds: 3
            failureThreshold: 40
          readinessProbe:
            httpGet: { path: /ready, port: http }
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 20
            timeoutSeconds: 3
          resources:
            requests: { cpu: 50m, memory: 96Mi }
            limits: { cpu: 500m, memory: 256Mi }
          securityContext: *contenedor-seguro
---
apiVersion: v1
kind: Service
metadata:
  name: captacion
spec:
  selector: { app.kubernetes.io/name: captacion }
  ports:
    - { name: http, port: 8017, targetPort: http }
