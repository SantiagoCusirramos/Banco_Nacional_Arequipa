# Frontend (Next.js). El navegador solo habla con él; reenvía a COREDB, CUENTAS, TARJETAS y SOL
# desde su servidor.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  labels: { app.kubernetes.io/name: frontend }
spec:
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: frontend }
  template:
    metadata:
      labels: { app.kubernetes.io/name: frontend }
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: frontend
          image: bna/frontend:local
          envFrom:
            - configMapRef: { name: bna-configuracion }
          ports:
            - { name: http, containerPort: 3000 }
          startupProbe:
            httpGet: { path: /login, port: http }
            periodSeconds: 3
            failureThreshold: 40
          readinessProbe:
            httpGet: { path: /login, port: http }
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet: { path: /login, port: http }
            periodSeconds: 20
            timeoutSeconds: 3
          resources:
            requests: { cpu: 100m, memory: 192Mi }
            limits: { cpu: "1", memory: 512Mi }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL] }
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
spec:
  selector: { app.kubernetes.io/name: frontend }
  ports:
    - { name: http, port: 3000, targetPort: http }
