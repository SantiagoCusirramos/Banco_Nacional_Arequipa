# Bus de Servicios: los canales llegan a los módulos a través de él. /bus/<módulo>/<ruta> se
# reenvía al módulo sin tocar cabeceras, cuerpo ni códigos. Las direcciones de los módulos
# (BUS_URL_*) y la lista de consumidores salen del ConfigMap; sus credenciales, del Secret.
# Sin ellas no arranca.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bus
  labels: { app.kubernetes.io/name: bus }
spec:
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: bus }
  template:
    metadata:
      labels: { app.kubernetes.io/name: bus }
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: bus
          image: bna/backend:local
          command: [uvicorn, BUS_SERVICIOS.main:app, --host, 0.0.0.0, --port, "8018"]
          envFrom:
            - configMapRef: { name: bna-configuracion }
          env:
            - name: BUS_TOKEN_FRONTEND
              valueFrom: { secretKeyRef: { name: bna-secretos, key: BUS_TOKEN_FRONTEND } }
            - name: BUS_TOKEN_PRUEBAS
              valueFrom: { secretKeyRef: { name: bna-secretos, key: BUS_TOKEN_PRUEBAS } }
          ports:
            - { name: http, containerPort: 8018 }
          # /salud solo dice que el Bus atiende: no depende de los módulos.
          startupProbe:
            httpGet: { path: /salud, port: http }
            periodSeconds: 3
            failureThreshold: 40
          readinessProbe:
            httpGet: { path: /salud, port: http }
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet: { path: /salud, port: http }
            periodSeconds: 20
            timeoutSeconds: 3
          resources:
            requests: { cpu: 50m, memory: 96Mi }
            limits: { cpu: 500m, memory: 256Mi }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL] }
---
apiVersion: v1
kind: Service
metadata:
  name: bus
spec:
  selector: { app.kubernetes.io/name: bus }
  ports:
    - { name: http, port: 8018, targetPort: http }
