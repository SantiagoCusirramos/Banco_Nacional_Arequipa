# CUENTAS: cuentas de ahorro, sobre COREDB. No tiene base propia.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cuentas
  labels: { app.kubernetes.io/name: cuentas }
spec:
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: cuentas }
  template:
    metadata:
      labels: { app.kubernetes.io/name: cuentas }
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: cuentas
          image: bna/backend:local
          command: [uvicorn, CUENTAS.main:app, --host, 0.0.0.0, --port, "8001"]
          env:
            - name: CORE_BASE_URL
              valueFrom: { configMapKeyRef: { name: bna-configuracion, key: CORE_BASE_URL } }
          ports:
            - { name: http, containerPort: 8001 }
          startupProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 3
            failureThreshold: 40
          readinessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 20
            timeoutSeconds: 3
          resources:
            requests: { cpu: 50m, memory: 96Mi }
            limits: { cpu: 500m, memory: 256Mi }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL] }
---
apiVersion: v1
kind: Service
metadata:
  name: cuentas
spec:
  selector: { app.kubernetes.io/name: cuentas }
  ports:
    - { name: http, port: 8001, targetPort: http }
