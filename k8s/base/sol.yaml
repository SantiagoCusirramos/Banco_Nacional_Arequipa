# SOL: solicitud de crédito, sin base propia. El borrador, la bandeja y la bitácora están en
# COREDB; las referencias de clientes, en CAPTACION (CR-INT-01); el expediente va a EVALUACION
# (CR-INT-02), que devuelve el resultado (CR-INT-03). Todo por el Bus. La persona entra con su
# usuario de COREDB; lo de SOL va con svc-sol (lo crea el arranque de COREDB).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sol
  labels: { app.kubernetes.io/name: sol }
spec:
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: sol }
  template:
    metadata:
      labels: { app.kubernetes.io/name: sol }
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: sol
          image: bna/sol:local
          command: [uvicorn, SOL.app:app, --host, 0.0.0.0, --port, "8011"]
          env:
            - name: SOL_BUS_URL
              value: http://bus:8018/bus
            - name: SOL_BUS_TOKEN
              valueFrom: { secretKeyRef: { name: bna-secretos, key: BUS_TOKEN_SOL } }
            - name: SOL_COREDB_USUARIO
              value: svc-sol
            - name: SOL_COREDB_SECRETO
              valueFrom: { secretKeyRef: { name: bna-secretos, key: SOL_COREDB_SECRETO } }
            - name: SOL_CAP_TOKEN
              valueFrom: { secretKeyRef: { name: bna-secretos, key: CAP_SOL_TOKEN } }
            - name: SOL_EVA_TOKEN
              valueFrom: { secretKeyRef: { name: bna-secretos, key: EVALUACION_TOKEN_SOL } }
            - name: SOL_EVA_CALLBACK_TOKEN
              valueFrom: { secretKeyRef: { name: bna-secretos, key: EVALUACION_SOL_TOKEN_RESULTADOS } }
          ports:
            - { name: http, containerPort: 8011 }
          # /ready comprueba que COREDB responde por el Bus.
          startupProbe:
            httpGet: { path: /ready, port: http }
            periodSeconds: 3
            failureThreshold: 60
          readinessProbe:
            httpGet: { path: /ready, port: http }
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 20
            timeoutSeconds: 3
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: "1", memory: 384Mi }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL] }
---
apiVersion: v1
kind: Service
metadata:
  name: sol
spec:
  selector: { app.kubernetes.io/name: sol }
  ports:
    - { name: http, port: 8011, targetPort: http }
