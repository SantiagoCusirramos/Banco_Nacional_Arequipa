<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BNA · Home Banking · Acceso al canal</title>
<link rel="stylesheet" href="css/estilos.css">
</head>
<body>

<header class="hdr">
  <div class="marca">
    <div class="marca-logo">BNA</div>
    <div class="marca-txt">
      <strong>Banco Nacional de Arequipa</strong>
      <span>Home Banking · acceso seguro</span>
    </div>
  </div>
  <div class="sesion">
    <div class="quien">
      <b>Canal web seguro</b>
        <span id="estadoCanal">Verificando el servicio…</span>
    </div>
  </div>
</header>

<main class="login-cuerpo">
  <div class="login-tarjeta">
    <div class="login-cab">
      <div class="marca-logo">BNA</div>
      <h1>Ingresa al Home Banking</h1>
      <p>Acceso seguro a su banca en línea</p>
    </div>

    <div class="login-cuerpo-int">
      <form id="formLogin" autocomplete="off" novalidate>
        <div class="campo">
          <label for="usuario">Usuario</label>
          <input type="text" id="usuario" name="usuario" maxlength="60" required>
        </div>

        <div class="campo">
          <label for="claveWeb">Clave</label>
          <input type="password" id="claveWeb" name="claveWeb" maxlength="200" required>
          <div class="pista">Ingrese sus credenciales para continuar.</div>
        </div>

        <div class="campo">
          <label for="codCliente">Código del cliente atendido</label>
          <input type="text" id="codCliente" name="codCliente" placeholder="Código de cliente" maxlength="12" required>
        </div>

        <button type="submit" class="btn ancho-total" id="btnIngresar">Ingresar</button>
      </form>

      <div class="msg" id="msgLogin"></div>
    </div>
  </div>
</main>

<script src="js/bus.js"></script>
<script src="js/comun.js"></script>
<script src="js/login.js"></script>
</body>
</html>
