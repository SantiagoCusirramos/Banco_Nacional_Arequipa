# Base integrada del CORE (MySQL 8.4) para la API backend/COREDB. Es aparte de
# la BD legada `bna`: la API actual no cambia y este servicio usa el puerto 3307.
#   cp backend/COREDB/.env.example backend/COREDB/.env   # y completar las claves
#   docker compose -f docker-compose.coredb.yml --env-file backend/COREDB/.env up -d
# Los scripts de inicio solo corren con un volumen vacío (ver database/README-UPSTREAM.md).
services:
  bna-core-db:
    image: mysql:8.4@sha256:24989179f58856db763f418010c1169fecc944e3ec1ea7e921572d83eb070f70
    # No definir MYSQL_DATABASE ni MYSQL_USER: crearían un usuario con todos los
    # privilegios, fuera del rol bna_app.
    environment:
      MYSQL_ROOT_PASSWORD: ${CORE_DB_ROOT_PASSWORD:?Falta CORE_DB_ROOT_PASSWORD}
      CORE_DB_APP_PASSWORD: ${CORE_DB_APP_PASSWORD:?Falta CORE_DB_APP_PASSWORD}
      CORE_DB_ADMIN_PASSWORD: ${CORE_DB_ADMIN_PASSWORD:?Falta CORE_DB_ADMIN_PASSWORD}
      CORE_DB_SEGURIDAD_PASSWORD: ${CORE_DB_SEGURIDAD_PASSWORD:?Falta CORE_DB_SEGURIDAD_PASSWORD}
    volumes:
      - ./database/conf/mysql/bna.cnf:/bna/bna.cnf:ro
      - ./database/sql/bna_core.sql:/docker-entrypoint-initdb.d/01_bna_core.sql:ro
      - ./database/sql/bna_extension.sql:/docker-entrypoint-initdb.d/02_bna_extension.sql:ro
      - ./database/conf/mysql/crear_usuarios.sh:/docker-entrypoint-initdb.d/03_crear_usuarios.sh:ro
      - core-db-data:/var/lib/mysql
    # MySQL ignora un archivo escribible por todos, como puede verse un montaje
    # desde Windows; por eso se copia con permisos 644.
    entrypoint:
      - sh
      - -c
      - install -m 644 /bna/bna.cnf /etc/mysql/conf.d/bna.cnf && exec docker-entrypoint.sh mysqld
    ports:
      - "127.0.0.1:${CORE_DB_PORT:-3307}:3306"
    healthcheck:
      test:
        - CMD-SHELL
        - MYSQL_PWD="$$MYSQL_ROOT_PASSWORD" mysql -uroot -h127.0.0.1 --protocol=TCP -e 'CALL core.verificar_configuracion()'
      interval: 5s
      timeout: 5s
      retries: 40

volumes:
  core-db-data:
