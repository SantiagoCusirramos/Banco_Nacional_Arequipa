services:
  # Nueva Base de Datos integrada COREDB (MySQL 8.4)
  bna_core_db:
    image: mysql:8.4
    container_name: bna_core_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      CORE_DB_APP_PASSWORD: apppassword
      CORE_DB_ADMIN_PASSWORD: adminpassword
      CORE_DB_SEGURIDAD_PASSWORD: segpassword
    volumes:
      - ./database/conf/mysql/bna.cnf:/bna/bna.cnf:ro
      - ./database/sql/bna_core.sql:/docker-entrypoint-initdb.d/01_bna_core.sql:ro
      - ./database/sql/bna_extension.sql:/docker-entrypoint-initdb.d/02_bna_extension.sql:ro
      - ./database/conf/mysql/crear_usuarios.sh:/docker-entrypoint-initdb.d/03_crear_usuarios.sh:ro
      - core-db-data:/var/lib/mysql
    entrypoint:
      - sh
      - -c
      - install -m 644 /bna/bna.cnf /etc/mysql/conf.d/bna.cnf && exec docker-entrypoint.sh mysqld
    ports:
      - "3307:3306"
    networks:
      - bna-net
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -prootpassword || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30

  # Backend COREDB (Base integrada)
  coredb:
    build:
      context: ./backend
      dockerfile: COREDB/Dockerfile
    container_name: bna_coredb
    restart: always
    environment:
      - CORE_DB_HOST=bna_core_db
      - CORE_DB_PORT=3306
      - CORE_DB_APP_USER=bna_app_user
      - CORE_DB_APP_PASSWORD=apppassword
      - CORE_DB_JWT_CLAVE=6b0591c3fb910b956535c59ecc9ccc8c24a23563266c365b8fed87eff4f2ce27
    ports:
      - "8012:8012"
    depends_on:
      bna_core_db:
        condition: service_healthy
    networks:
      - bna-net

  # Backend de cuentas (conectado a COREDB en 8012)
  cuentas:
    build:
      context: ./backend
      dockerfile: CUENTAS/Dockerfile 
    container_name: bna_cuentas
    restart: always
    environment:
      - CORE_BASE_URL=http://bna_coredb:8012
    ports:
      - "8001:8001" 
    depends_on:
      - coredb
    networks:
      - bna-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: bna_frontend
    restart: always
    environment:
      - CUENTAS_GATEWAY_URL=http://bna_cuentas:8001/api/v1/cuentas
    ports:
      - "3000:3000"
    depends_on:
      - cuentas
      - coredb
    networks:
      - bna-net

networks:
  bna-net:
    driver: bridge

volumes:
  core-db-data:
