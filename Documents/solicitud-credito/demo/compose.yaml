{
  "name": "${DEMO_PROJECT:?}",
  "services": {
    "mysql": {
      "image": "mysql:8.4@sha256:24989179f58856db763f418010c1169fecc944e3ec1ea7e921572d83eb070f70",
      "env_file": [
        "${DEMO_STATE:?}/mysql.env"
      ],
      "tmpfs": [
        "/var/lib/mysql:rw,nosuid,size=1024m",
        "/var/run/mysqld:rw,nosuid,size=16m"
      ],
      "healthcheck": {
        "test": [
          "CMD-SHELL",
          "MYSQL_PWD=\"$$MYSQL_ROOT_PASSWORD\" mysql --protocol=socket -uroot -Nse \"SELECT 1\" >/dev/null 2>&1"
        ],
        "interval": "3s",
        "timeout": "3s",
        "retries": 60
      },
      "labels": {
        "bna.sol.demo": "${DEMO_ID:?}"
      },
      "networks": [
        "demo"
      ],
      "restart": "no"
    },
    "init": {
      "image": "${DEMO_PROJECT:?}/backend:local",
      "build": {
        "context": "${DEMO_CONTEXT:?}/backend"
      },
      "env_file": [
        "${DEMO_STATE:?}/init.env"
      ],
      "environment": {
        "SOL_DB_HOST": "mysql",
        "SOL_DB_PORT": "3306",
        "SOL_DB_NAME": "bna_sol_mvp_demo",
        "SOL_DB_USER": "sol_demo",
        "SOL_INTEGRATION_MODE": "SIMULADO",
        "SOL_WORKER_SECONDS": "1",
        "SOL_INITIAL_PASSWORD": "${DEMO_LOGIN_PASSWORD:?}"
      },
      "command": [
        "python",
        "-m",
        "SOL.manage",
        "init"
      ],
      "depends_on": {
        "mysql": {
          "condition": "service_healthy"
        }
      },
      "labels": {
        "bna.sol.demo": "${DEMO_ID:?}"
      },
      "networks": [
        "demo"
      ],
      "restart": "no",
      "read_only": true,
      "tmpfs": [
        "/tmp:rw,noexec,nosuid,size=64m"
      ],
      "cap_drop": [
        "ALL"
      ],
      "security_opt": [
        "no-new-privileges:true"
      ]
    },
    "sol": {
      "image": "${DEMO_PROJECT:?}/backend:local",
      "build": {
        "context": "${DEMO_CONTEXT:?}/backend"
      },
      "env_file": [
        "${DEMO_STATE:?}/app.env"
      ],
      "environment": {
        "SOL_DB_HOST": "mysql",
        "SOL_DB_PORT": "3306",
        "SOL_DB_NAME": "bna_sol_mvp_demo",
        "SOL_DB_USER": "sol_demo",
        "SOL_INTEGRATION_MODE": "SIMULADO",
        "SOL_WORKER_SECONDS": "1"
      },
      "command": [
        "uvicorn",
        "SOL.app:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8011",
        "--no-access-log"
      ],
      "ports": [
        "127.0.0.1:${DEMO_API_PORT:?}:8011"
      ],
      "depends_on": {
        "init": {
          "condition": "service_completed_successfully"
        }
      },
      "healthcheck": {
        "test": [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen(\"http://127.0.0.1:8011/ready\",timeout=3)"
        ],
        "interval": "3s",
        "timeout": "4s",
        "retries": 40
      },
      "labels": {
        "bna.sol.demo": "${DEMO_ID:?}"
      },
      "networks": [
        "demo",
        "edge"
      ],
      "restart": "no",
      "read_only": true,
      "tmpfs": [
        "/tmp:rw,noexec,nosuid,size=64m"
      ],
      "cap_drop": [
        "ALL"
      ],
      "security_opt": [
        "no-new-privileges:true"
      ]
    },
    "frontend": {
      "image": "${DEMO_PROJECT:?}/frontend:local",
      "build": {
        "context": "${DEMO_CONTEXT:?}/frontend"
      },
      "environment": {
        "SOL_GATEWAY_URL": "http://sol:8011/gateway/sol",
        "SOL_PUBLIC_ORIGIN": "http://127.0.0.1:${DEMO_PORT:?}",
        "SOL_COOKIE_SECURE": "false",
        "NEXT_TELEMETRY_DISABLED": "1"
      },
      "ports": [
        "127.0.0.1:${DEMO_PORT:?}:3000"
      ],
      "depends_on": {
        "sol": {
          "condition": "service_healthy"
        }
      },
      "healthcheck": {
        "test": [
          "CMD",
          "node",
          "-e",
          "fetch(\"http://127.0.0.1:3000/solicitud-credito\").then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
        ],
        "interval": "3s",
        "timeout": "5s",
        "retries": 40
      },
      "labels": {
        "bna.sol.demo": "${DEMO_ID:?}"
      },
      "networks": [
        "edge"
      ],
      "restart": "no",
      "read_only": true,
      "tmpfs": [
        "/tmp:rw,noexec,nosuid,size=64m"
      ],
      "cap_drop": [
        "ALL"
      ],
      "security_opt": [
        "no-new-privileges:true"
      ]
    },
    "scenarios": {
      "image": "${DEMO_PROJECT:?}/backend:local",
      "build": {
        "context": "${DEMO_CONTEXT:?}/backend"
      },
      "environment": {
        "DEMO_ORIGIN": "http://127.0.0.1:${DEMO_PORT:?}",
        "DEMO_LOGIN_PASSWORD": "${DEMO_LOGIN_PASSWORD:?}"
      },
      "command": [
        "python",
        "seed_demo.py"
      ],
      "depends_on": {
        "frontend": {
          "condition": "service_healthy"
        }
      },
      "profiles": [
        "prepare"
      ],
      "labels": {
        "bna.sol.demo": "${DEMO_ID:?}"
      },
      "networks": [
        "edge"
      ],
      "restart": "no",
      "read_only": true,
      "tmpfs": [
        "/tmp:rw,noexec,nosuid,size=64m"
      ],
      "cap_drop": [
        "ALL"
      ],
      "security_opt": [
        "no-new-privileges:true"
      ]
    }
  },
  "networks": {
    "demo": {
      "internal": true,
      "labels": {
        "bna.sol.demo": "${DEMO_ID:?}"
      }
    },
    "edge": {
      "internal": false,
      "labels": {
        "bna.sol.demo": "${DEMO_ID:?}"
      }
    }
  }
}
