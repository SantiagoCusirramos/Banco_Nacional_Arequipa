# Laboratorio exclusivo E06. No extiende compose.yaml ni usa volúmenes BNA.
# Variables sensibles: archivo temporal externo, permisos 0600; nunca versionarlo.
services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${E06_MYSQL_PASSWORD:?}
      MYSQL_DATABASE: bna_sol_mvp_test
    tmpfs:
      - /var/lib/mysql
    ports:
      - "127.0.0.1:13316:3306"
    healthcheck:
      test: [CMD-SHELL, 'MYSQL_PWD="$$MYSQL_ROOT_PASSWORD" mysql -uroot -h127.0.0.1 -e "SELECT 1" >/dev/null']
      interval: 3s
      timeout: 3s
      retries: 40
  sol:
    image: bna-sol-e06:validation
    build:
      context: ../../backend
      dockerfile: ../docker/python/Dockerfile
      args:
        REQUISITOS: requirements-sol.txt
    environment: &sol-env
      SOL_DB_HOST: mysql
      SOL_DB_NAME: bna_sol_mvp_e06
      SOL_DB_USER: root
      SOL_DB_PASSWORD: ${E06_MYSQL_PASSWORD:?}
      SOL_INITIAL_PASSWORD: ${E06_LOGIN_PASSWORD:?}
      SOL_INTEGRATION_MODE: SIMULADO
      SOL_WORKER_SECONDS: "1"
    command: [uvicorn, 'SOL.app:app', --host, 0.0.0.0, --port, '8011']
    ports:
      - "127.0.0.1:18016:8011"
    depends_on:
      init:
        condition: service_completed_successfully
  init:
    image: bna-sol-e06:validation
    environment: *sol-env
    command: [python, -m, SOL.manage, init]
    depends_on:
      mysql:
        condition: service_healthy
  frontend:
    # Build E05/E06 ya comprobado en copia temporal; no contiene .env del repo.
    image: node:22-bookworm-slim
    working_dir: /app
    user: node
    volumes:
      - ${E06_FRONTEND_DIR:?}:/app:ro
    environment:
      SOL_GATEWAY_URL: http://sol:8011/gateway/sol
      SOL_COOKIE_SECURE: "false"
      SOL_PUBLIC_ORIGIN: http://127.0.0.1:13016
      NEXT_TELEMETRY_DISABLED: "1"
    command: [node, node_modules/next/dist/bin/next, start, --hostname, 0.0.0.0, --port, '3000']
    ports:
      - "127.0.0.1:13016:3000"
    depends_on:
      - sol
